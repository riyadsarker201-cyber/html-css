<!Doctype HTML>
<html>
<head>
<meta charset="utf-8">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: url('https://images.unsplash.com/photo-1620121692029-d088224ddc74?q=80&w=2532&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;
  min-height: 100vh;
  font-family: Arial;
}

.grid {
  margin: 50px auto;
  max-width: 560px;
  display: grid;
  gap: 20px;
  grid-template-columns: repeat(12,1fr);
}


.card {
  background: rgba(255,255,255,0.15);
  padding:25px;
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:35px;
  color:white;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.weather {
  grid-area:1 / 1 / 2 / 13;
}

.weather-location {
  font-size:28px;
  font-weight:bold;
  margin-bottom:20px;
}


.weather-current {
  display:flex;
  justify-content:space-between;
  align-items:center;
}


.weather-current h1 {
  font-size:90px;
  font-weight:300;
}


.weather-summary {
  text-align:center;
  font-size:22px;
  font-weight:bold;
}


.weather-icon {
  font-size:55px;
  margin-bottom:10px;
}


.weather-hourly {
  display:flex;
  gap:12px;
  margin-top:35px;
}


.weather-hourly div {
  width:75px;
  height:120px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25);
  border-radius:18px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
}


.weather-hourly span {
  font-size:14px;
}


.weather-hourly strong {
  font-size:20px;
}





.podcast {
  grid-area:2 / 1 / 3 / 7;
}


.note {
  grid-area:2 / 7 / 3 / 13;
}


.box {
  grid-area:3 / 1 / 4 / 13;
}


.podcast-icon,
.note-icon {
  font-size:35px;
  margin:10px 0;
}


.podcast-title,
.note-title {
  font-size:20px;
  margin-top:15px;
  font-weight:bold;
}


</style>

</head>


<body>


<div class="grid">


<div class="card weather">


<div class="weather-location">
🌍 San Francisco
</div>


<div class="weather-current">


<div>
<h1>54°</h1>
</div>


<div class="weather-summary">

<div class="weather-icon">
🌈
</div>

<div>
Party Cloudy
</div>

<div>
H:57° L:49°
</div>

</div>


</div>



<div class="weather-hourly">


<div>
<span>10 AM</span>
<span>🌥️</span>
<strong>54°</strong>
</div>


<div>
<span>11 AM</span>
<span>🌦️</span>
<strong>55°</strong>
</div>


<div>
<span>12 PM</span>
<span>🔥</span>
<strong>56°</strong>
</div>


<div>
<span>1 PM</span>
<span>☀️</span>
<strong>57°</strong>
</div>


<div>
<span>2 PM</span>
<span>🌞</span>
<strong>57°</strong>
</div>


<div>
<span>3 PM</span>
<span>🌤️</span>
<strong>56°</strong>
</div>


</div>


</div>





<div class="card podcast">

<div class="podcast-icon">
🎧
</div>

<div>
Mar 19
</div>

<div class="podcast-title">
What is a Quantum Computer?
</div>

<div>
▶ 39m
</div>

</div>





<div class="card note">

<div class="note-icon">
⭐
</div>

<div class="note-title">
Call Mom
</div>

</div>




<div class="card box">

<div class="note-icon">
🔥
</div>

<div class="note-title">
Call Dad
</div>

</div>



</div>


</body>
</html>
