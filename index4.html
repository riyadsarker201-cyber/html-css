<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Card</title>
    <style>
        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        }
        body{
        min-height:100vh;
        display:grid;
        place-items:center;
        background: url(https://images.pexels.com/photos/1612351/pexels-photo-1612351.jpeg);
        background-size: cover;
        }
        .weather-card{
        width:600px;
        height:600px;
        border-radius:30px;
        overflow:hidden;
        color:#eaf3fa;
        margin: 30px auto;
        padding:28px 32px;
        background:linear-gradient(180deg,#1f527e 0%,#376a94 45%,#6597bd 100%);
        box-shadow:0 12px 30px rgba(0,0,0,.18);
        }
        .top{
        display:grid;
        grid-template-columns:1fr auto;
        align-items:start;
        }
        .city{
        font-size:28px;
        font-weight:600;
        letter-spacing:.2px;
        color:#d7e5ef;
        }
        .city span{
        font-size:18px;
        font-style:italic;
        margin-left:5px;
        }
        .temp{
        font-size:68px;
        font-weight:400;
        margin-top:8px;
        line-height:1;
        }
        .sun-top{
        font-size:30px;
        text-align:right;
        }
        .sunny{
        font-size:23px;
        font-weight:600;
        margin-top:10px;
        color:#e1e9ef;
        }
        .time{
        font-size:17px;
        margin-top:7px;
        color:#d0dce6;
        }
        .hourly{
        margin-top:28px;
        border-top:1px solid rgba(255,255,255,.12);
        border-bottom:1px solid rgba(255,255,255,.12);
        padding:20px 0 22px;
        display:grid;
        grid-template-columns:repeat(6,1fr);
        text-align:center;
        }
        .hour{
        font-size:17px;
        color:#c8d8e4;
        margin-bottom:18px;
        }
        .hour-sun{
        font-size:30px;
        margin-bottom:15px;
        }
        .degree{
        font-size:17px;
        color:#dce8ef;
        }
        .daily{
        padding-top:20px;
        display:grid;
        gap:14px;
        }
        .day-row{
        height:34px;
        display:grid;
        grid-template-columns:75px 55px 60px 1fr 60px;
        align-items:center;
        font-size:18px;
        }
        .day{
        font-weight:600;
        color:#e3edf3;
        }
        .icon{
        font-size:30px;
        line-height:1;
        }
        .low{
        color:#d1dfeb;
        text-align:right;
        }
        .bar{
        height:6px;
        background:#ffd800;
        border-radius:10px;
        margin:0 14px;
        }
        .bar.short{
        width:65%;
        }
        .bar.medium1{
        width:82%;
        }
        .bar.medium2{
            width: 20%;
        }
        .bar.long1{
        width:100%;
        }
        .bar.long2{
            width: 40%;
        }
        .high{
        font-weight:600;
        color:#e8f0f5;
        text-align:right;
        }
    </style>
</head>

<body>
    <div class="weather-card">
        <div class="top">
            <div>
                <div class="city">Enschede <span>↗</span></div>
                <div class="temp">25°</div>
            </div>
            <div>
                <div class="sun-top">☀️</div>
                <div class="sunny">Mostly Sunny</div>
                <div class="time">H:25° L:13°</div>
            </div>
        </div>
        <div class="hourly">
            <div>
                <div class="hour">16</div>
                <div class="hour-sun">☀️</div>
                <div class="degree">25°</div>
            </div>
            <div>
                <div class="hour">17</div>
                <div class="hour-sun">☀️</div>
                <div class="degree">25°</div>
            </div>
            <div>
                <div class="hour">18</div>
                <div class="hour-sun">☀️</div>
                <div class="degree">25°</div>
            </div>
            <div>
                <div class="hour">19</div>
                <div class="hour-sun">☀️</div>
                <div class="degree">24°</div>
            </div>
            <div>
                <div class="hour">20</div>
                <div class="hour-sun">☀️</div>
                <div class="degree">23°</div>
            </div>
            <div>
                <div class="hour">21</div>
                <div class="hour-sun">☀️</div>
                <div class="degree">22°</div>
            </div>
        </div>
        <div class="daily">
            <div class="day-row">
                <div class="day">Sat</div>
                <div class="icon">🌧️</div>
                <div class="low">15°</div>
                <div class="bar medium1"></div>
                <div class="high">24°</div>
            </div>
            <div class="day-row">
                <div class="day">Sun</div>
                <div class="icon">☁️</div>
                <div class="low">15°</div>
                <div class="bar short"></div>
                <div class="high">22°</div>
            </div>
            <div class="day-row">
                <div class="day">Mon</div>
                <div class="icon">🌤️</div>
                <div class="low">14°</div>
                <div class="bar long1"></div>
                <div class="high">25°</div>
            </div>
            <div class="day-row">
                <div class="day">Tue</div>
                <div class="icon">☀️</div>
                <div class="low">15°</div>
                <div class="bar long2"></div>
                <div class="high">28°</div>
            </div>
            <div class="day-row">
                <div class="day">Wed</div>
                <div class="icon">☁️</div>
                <div class="low">16°</div>
                <div class="bar medium2"></div>
                <div class="high">24°</div>
            </div>
        </div>
    </div>
</body>

</html>
