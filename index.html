<!Doctype HTML>
<html>
<head>
<meta charset="utf-8">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: url(https://unblast.com/wp-content/uploads/2021/01/Space-Background-Image-3-768x512.jpg);
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;
  min-height: 100vh;
  font-family: Arial;
}

.grid {
  margin: 50px auto;
  max-width: 560px;
  display: grid;
  gap: 20px;
  grid-template-columns: repeat(12,1fr);
}

.card {
  background: rgba(255,255,255,0.15);
  padding:25px;
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:35px;
  color:white;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.weather {
  grid-area:1 / 1 / 2 / 13;
}

.podcast {
  grid-area:2 / 1 / 3 / 7;
}

.note {
  grid-area:2 / 7 / 3 / 13;
}
.box {
  grid-area:3 / 1 / 4 / 13;
}


.weather-icon,
.podcast-icon,
.note-icon {
  font-size:35px;
  margin:10px 0;
}

.weather-current {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.weather-hourly div {
  display:flex;
  justify-content:space-between;
  margin-top:12px;
}


.podcast-title,
.note-title {
  font-size:20px;
  margin-top:15px;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="grid">

<div class="card weather">

<div class="weather-location">
🌍 San Francisco
</div>

<div class="weather-current">

<div>
<h1>54°</h1>
</div>

<div class="weather-summary">

<div class="weather-icon">🌈</div>

<div>Rainbow Cloudy</div>

<div>H:57° L:49°</div>

</div>

</div>


<div class="weather-hourly">

<div>
<span>10 AM</span>
<span>🌥️</span>
<strong>54°</strong>
</div>

<div>
<span>11 AM</span>
<span>🌦️</span>
<strong>55°</strong>
</div>

<div>
<span>12 PM</span>
<span>🔥</span>
<strong>56°</strong>
</div>

<div>
<span>1 PM</span>
<span>☀️</span>
<strong>57°</strong>
</div>

<div>
<span>2 PM</span>
<span>🌞</span>
<strong>57°</strong>
</div>

<div>
<span>3 PM</span>
<span>🌤️</span>
<strong>56°</strong>
</div>

</div>

</div>



<div class="card podcast">

<div class="podcast-header">

<div class="podcast-icon">🎧</div>

</div>

<div class="podcast-date">
Mar 19
</div>

<div class="podcast-title">
What is a Quantum Computer?
</div>

<div class="podcast-duration">
▶ <span>39m</span>
</div>

</div>



<div class="card note">

<div class="note-icon">
⭐
</div>

<div class="note-title">
Call Mom
</div>

</div>

<div class="card box">

<div class="note-icon">
🔥
</div>

<div class="note-title">
Call Dad
</div>

</div>
</body>
</html>
